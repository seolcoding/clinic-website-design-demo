name: Verify and deploy fictional clinic demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout public-only repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify approved bundle and synthetic-only content
        shell: bash
        run: |
          node <<'JS'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const assert=require('node:assert/strict');
          const digests=JSON.parse(fs.readFileSync('digests.json','utf8'));
          const sha=(p)=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const files=fs.readdirSync('.').filter(n=>n!=='.git'&&n!=='.github').sort();
          assert.deepEqual(files,['.nojekyll','README.md','digests.json','index.html','robots.txt','ui-lab']);
          const lab=fs.readdirSync('ui-lab').sort();
          assert.deepEqual(lab,['index.html','mantine.html','mui.html','shadcn.html']);
          assert.equal(Object.keys(digests).length,5,'digests.json must pin index.html and the four ui-lab files');
          for(const [file,expected] of Object.entries(digests))assert.equal(sha(file),expected,'Published digest changed without review: '+file);
          const index=fs.readFileSync('index.html','utf8');
          for(const term of ['script.google.com','content-review.html','source-facts.json','qaPublished()','qaPublish(','data-action="admin"','design-studio.html','channel-manager.html','아산봄내과의원','춘천예치과','경희봄한의원','올림푸스 CV-290','척추신경추나의학회'])assert(!index.includes(term),'Excluded field appeared in index: '+term);
          assert(index.includes('가상 브랜드 · 실제 의료기관이 아닙니다.'));
          assert(index.includes('noindex,nofollow'));
          for(const name of ['index','shadcn','mantine','mui']){
            const html=fs.readFileSync('ui-lab/'+name+'.html','utf8');
            for(const term of ['script.google.com','content-review.html','source-facts.json','qaPublished()','qaPublish(','data-action="admin"'])assert(!html.includes(term),'Excluded field appeared in ui-lab/'+name+': '+term);
            assert(html.includes('noindex'),'ui-lab/'+name+' must block indexing');
            assert(html.includes('가상'),'ui-lab/'+name+' must disclose the fictional context');
          }
          assert(!fs.readFileSync('ui-lab/index.html','utf8').includes('비공개'),'ui-lab gallery must not claim to be private');
          assert(fs.readFileSync('robots.txt','utf8').includes('Disallow: /'));
          console.log('PASS: approved digests, public file set, no admin/QA leakage, fictional notices present.');
          JS
      - name: Prepare exact public artifact
        run: |
          mkdir -p "$RUNNER_TEMP/pages/ui-lab"
          cp index.html robots.txt README.md .nojekyll digests.json "$RUNNER_TEMP/pages/"
          cp ui-lab/index.html ui-lab/shadcn.html ui-lab/mantine.html ui-lab/mui.html "$RUNNER_TEMP/pages/ui-lab/"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload approved artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
