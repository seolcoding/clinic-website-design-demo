name: Verify and deploy fictional clinic demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout public-only repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify approved bundle and synthetic-only content
        shell: bash
        run: |
          node <<'JS'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const assert=require('node:assert/strict');
          const html=fs.readFileSync('index.html','utf8');
          const digest=crypto.createHash('sha256').update(html).digest('hex');
          assert.equal(digest,'64432c3cb205460d90c74c5d966ef64b3ff815d8ef7f46aa15a5211ac69f4b4c','Published HTML digest changed without review');
          const files=fs.readdirSync('.').filter(n=>n!=='.git'&&n!=='.github').sort();
          assert.deepEqual(files,['.nojekyll','README.md','index.html','robots.txt']);
          for(const term of ['script.google.com','content-review.html','source-facts.json','qaPublished()','data-action="admin"','아산봄내과의원','춘천예치과','경희봄한의원','올림푸스 CV-290','척추신경추나의학회'])assert(!html.includes(term),`Excluded field appeared: ${term}`);
          assert(html.includes('가상 브랜드 · 실제 의료기관이 아닙니다.'));
          assert(html.includes('noindex,nofollow'));
          assert(fs.readFileSync('robots.txt','utf8').includes('Disallow: /'));
          console.log('PASS: approved SHA-256, four public files, no admin/real-clinic review data, fictional notices present.');
          JS
      - name: Prepare exact public artifact
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          cp index.html robots.txt README.md .nojekyll "$RUNNER_TEMP/pages/"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload approved artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
